  fs=[];pj=[];pt=[];fx=[];T=0;ts=1;tsT=0;hs=0;shk=0;fl=0;zT=0;tmr=99;win=null;vLock=null;
  try{speechSynthesis.cancel()}catch(e){}
  const picks=[[sel[0],sel[1]],[sel[2],sel[3]]];
  for(let t=0;t<2;t++){
    const list=picks[t].filter(v=>v>=0);
    if(!list.length)list.push(Math.floor(R(0,CH.length)));
    list.forEach((ci,j)=>fs.push(mk(ci,t,j)));
  }
  fs.forEach((f,i)=>{if(fs.slice(0,i).some(g=>g.i===f.i))f.pal=1});
  for(const id of['menu','pause','res'])$('#'+id).style.display='none';
  $('#hud').style.display='block';$('#bt').style.display='flex';paused=false;$('#bP').textContent='Pause';
  cam.x=700;cam.w=900;
  if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
  if(ac&&ac.state==='suspended')ac.resume();
  music(1);mode='cd';cdn=2.6;
  const names=fs.map(f=>f.c.n).join('  vs  ');
  capShow(names+(trn?' (TRAINING)':''),'#fff');
}

function setPause(p){if(mode==='menu'||mode==='res')return;paused=p;$('#pause').style.display=p?'flex':'none';
  $('#bP').textContent=p?'Resume':'Pause';last=performance.now();

function checkWin(){
  const t0=fs.filter(f=>f.team===0),t1=fs.filter(f=>f.team===1);
  const d0=t0.every(f=>f.st==='dead'),d1=t1.every(f=>f.st==='dead');
  if(d0||d1){
    mode='ko';
    win=(d0&&d1)?null:(d1?t0.find(f=>f.st!=='dead'):t1.find(f=>f.st!=='dead'));
    koT=2.6;ts=.25;tsT=1.4;zm=1.5;zF=win||t0[0];zT=1.6;shk=22;fl=.6;
    capShow('K.O.!','#ff4d4d');sfx('boom');
    if(win)say(win,'Victory!',1);
  }
}
function update(dt,raw){
  T+=dt;
  if(trn)fs.forEach(f=>{if(f.team===0)f.en=100});
  if(trn)tmr=99;
  rec.push(fs.map(f=>Object.assign({},f)));if(rec.length>150)rec.shift();
  if(mode==='fight'){
    tmr-=raw;
    if(tmr<=0){
      tmr=0;mode='ko';
      const s0=fs.filter(f=>f.team===0).reduce((a,b)=>a+b.hp,0),s1=fs.filter(f=>f.team===1).reduce((a,b)=>a+b.hp,0);
      win=s0===s1?null:s0>s1?fs.find(f=>f.team===0):fs.find(f=>f.team===1);
      koT=1.5;capShow('TIME!','#fff');
    }
  }
  for(const f of fs){const o=nearest(f);updF(f,o||f,dt)}
  updPj(dt);
  for(let i=0;i<fs.length;i++)for(let j=i+1;j<fs.length;j++){
    const a=fs[i],b=fs[j];
    if(a.st==='dead'||b.st==='dead')continue;
    if(a.y!==0||b.y!==0)continue;
    if(['oni','asura'].some(m=>(a.m===m&&a.st==='sp')||(b.m===m&&b.st==='sp')))continue;
    const d=b.x-a.x;
    if(Math.abs(d)<34){const p=(34-Math.abs(d))/2*sg(d||1);a.x=cl(a.x-p,LX,RX);b.x=cl(b.x+p,LX,RX)}
  }
  for(const p of pt){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.l-=dt}
  pt=pt.filter(p=>p.l>0);
  for(const e of fx){e.l-=dt;if(e.k==='r')e.r+=(e.mr-e.r)*Math.min(1,dt*10)}
  fx=fx.filter(e=>e.l>0);
  for(const p of pet){p.x+=(Math.sin(T+p.ph)*30)*dt;p.y+=p.v*dt;if(p.y>0){p.y=-420;p.x=R(0,AW)}}
  if(mode==='fight'&&!trn)checkWin();
}

function pose(f){

  const m=f.m,ph=s==='sp'&&SEQ[m]?SEQ[m][f.ph][0]:'',k=f.pt,set=(...a)=>a.forEach((v,i)=>p[i]=v);
  if(f.air&&['idle','walk','jump'].includes(s))set(.5,-1.2,1.1,-1.5,2.7,.15,3,.1,.3);
  else if(s==='walk'){set(.5,-1.3,1,-1.7,1.57+w*.7,.15,1.57-w*.7,.15)}
  else if(s==='jump')set(-.4,-.6,.2,-.8,.9,1.3,1.7,.9);
  else if(s==='dash')set(2.4,.2,2.6,.2,2.3,-.5,.6,.5,.5);
  else if(s==='atk'){
    const a=f.atk,u=cl(k/a[1],0,1),v=cl((k-a[1])/(a[2]+a[3]*.5),0,1);
    const lp=(x,y,t)=>x+(y-x)*t,e=1-(1-u)*(1-u),ex=k<a[1]?e:1-v*.78,nm=a[0];
    if(nm==='jab'){set(lp(1.2,-.4,ex),lp(-1.6,-1.2,ex),lp(-1.2,0,ex),lp(-1.0,0,ex),1.7,-.25,1.35,.2,lp(.12,.22,ex),0,lp(0,-.12,ex))}
    else if(nm==='cross'){set(lp(-1.1,0,ex),lp(-1.2,0,ex),lp(1.1,-1.3,ex),lp(-1.6,-1.1,ex),1.55,-.35,1.3,.25,lp(.12,.02,ex),0,lp(0,-.26,ex))}
    else if(nm==='kick'){set(1.4,-1.5,1.2,-1.4,lp(1.55,0,ex),lp(-1.35,-.1,ex),1.45,.25,lp(.1,-.38,ex),0,lp(0,.14,ex))}
    else if(nm==='heavy'){set(1.9,-.9,1.7,-.8,lp(1.55,-.1,ex),lp(-1.5,-.1,ex),lp(1.5,0,ex),lp(-1.4,0,ex),lp(.08,-.5,ex),0,lp(0,.5,ex))}
    else if(nm==='slash'){set(lp(-1.3,.4,ex),lp(-1.1,.3,ex),lp(-1.7,1.15,ex),lp(-1.1,.05,ex),1.6,-.3,1.3,.25,lp(.12,-.12,ex),0,lp(0,-.28,ex))}
    else set(1.4,-1.5,1.2,-1.4,lp(1.55,0,ex),lp(-1.3,-.1,ex),1.45,.25,.1,0,0);
  }
  else if(s==='block'){set(.7,-2.3,.9,-2.2,2.2,-.5,.8,.5,-.18);p[9]=9}
  else if(s==='hit')set(2.3,.3,2,.5,1.7,.2,1.4,.3,-.35);
  else if(s==='launch'){set(-.5,.3,.2,.3,.4,.6,.9,.4);p[10]=-1.3}
  else if(s==='land'){set(1.4,.2,1.2,.2,1,1.2,1.9,-.9);p[9]=14}
  else if(s==='dead'){set(1.4,.2,1.2,.2,1.5,.2,1.3,.2);p[9]=46;p[10]=-1.5}
  else if(mode==='ko'&&f===win)set(-1.2+Math.sin(T*5)*.3,-.3,-1,.3);
  else if(mode==='cd')set(0,-2,.2,-2,2,-.4,.9,.4,-.1);
  else if(s==='sp'){
    const Rl=ph==='rel',C=ph==='charge'||ph==='start';
    if(BM[m]){if(C){set(2.5,-.2,2.7,-.1,2.2,-.6,.7,.6,-.1);p[9]=8}else set(0,0,.05,0,2.2,-.5,.6,.5,.2)}
    else if(m==='ki'||m==='gum'||m==='fire'){if(C)set(2.2,-1,1.2,-1.6);else set(0,0,1.2,-1.6)}
    else if(m==='it'){if(C)set(.3,-2.4,1,-1.6);else set(2.4,.2,2.6,.2,2.3,-.5,.6,.5,.5)}

    else if(m==='kai'){set(2,.2,1.3,.3,2.2,-.6,.7,.6);p[9]=8}

    else if(m==='wave'||m==='getsu'){if(C)set(2.4,-.3,-.6,.2);else set(0,0,.2,0,2.2,-.5,.6,.5,.35)}

}
function limb(x,y,a,b,l,c,w){
  const ex=x+Math.cos(a)*l,ey=y+Math.sin(a)*l,hx=ex+Math.cos(a+b)*l,hy=ey+Math.sin(a+b)*l;
  X.strokeStyle=c;X.lineWidth=w;X.beginPath();X.moveTo(x,y);X.lineTo(ex,ey);X.lineTo(hx,hy);X.stroke();
  return[hx,hy,a+b];
}

  X.strokeStyle=cloth;X.lineWidth=14;X.beginPath();X.moveTo(0,0);X.lineTo(sx,sy);X.stroke();
  X.strokeStyle=c.sw?'#e9f5ee':acc;X.lineWidth=15;X.beginPath();X.moveTo(0,-2);X.lineTo(Math.sin(L)*5,-Math.cos(L)*5-4);X.stroke();
  if(c.sw){X.strokeStyle='#dfe6e8';X.lineWidth=2.5;

  if(c.bf){X.fillStyle=c.bf[0];X.fillRect(hx-12,hy+c.bf[1],24,6)}

function drawBeam(f){
  const b=f.beam;if(!b)return;
  const ex=b.ox+Math.cos(b.a)*b.len,ey=b.oy+Math.sin(b.a)*b.len;
  const wf=f.pt>.85?Math.max(.05,(1-f.pt)/.15):1,pu=1+Math.sin(T*50)*.08;
  X.lineCap='round';
  const bc=f.c.bc||['#3dbdff','#7fe6ff'];
  for(const[w,c,a]of[[64,bc[0],.28],[40,bc[1],.55],[16,'#fff',1]]){
    X.globalAlpha=a;X.strokeStyle=c;X.lineWidth=w*wf*pu;
    X.beginPath();X.moveTo(b.ox,b.oy);X.lineTo(ex,ey);X.stroke();
  }
  X.globalAlpha=1;X.fillStyle='#e8fbff';X.beginPath();X.arc(ex,ey,30*wf*pu,0,7);X.fill();
}
function drawPj(p){
  if(p.k==='clone'){
    X.globalAlpha=.8;
    drawF({c:p.o.c,x:p.x,y:0,vx:p.vx,vy:0,face:sg(p.vx),st:'walk',pt:0,team:0,m:'',ph:0,ssj:0,form:0,en:0,fast:0,air:0,atk:null,beam:null,pal:p.o.pal,kaiLv:0,cd:{}});
    X.globalAlpha=1;return;
  }
  if(p.k==='gum'){
    X.strokeStyle=p.o.c.skin;X.lineWidth=9;X.lineCap='round';
    X.beginPath();X.moveTo(p.o.x,p.y);X.lineTo(p.x,p.y);X.stroke();
    X.fillStyle=p.o.c.skin;X.beginPath();X.arc(p.x,p.y,14,0,7);X.fill();return;
  }
  X.fillStyle=p.col;
  if(p.k==='wave'){
    const d=sg(p.vx),a0=d>0?-1:Math.PI-1;
    X.strokeStyle=p.o.c.wc||'#eafff2';X.lineWidth=7;X.lineCap='round';
    X.beginPath();X.arc(p.x-d*p.r*.8,p.y,p.r*1.8,a0,a0+2);X.stroke();return;
  }
  X.globalAlpha=.3;X.beginPath();X.arc(p.x,p.y,p.r*1.5,0,7);X.fill();
  X.globalAlpha=1;X.beginPath();X.arc(p.x,p.y,p.r,0,7);X.fill();
